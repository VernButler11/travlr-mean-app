<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Available Trips</h2>
    <a class="btn btn-success" routerLink="/trips/add">Add Trip</a>
  </div>

  @if (loading) {
  <p>Loading trips...</p>
  } @else {
  <div class="row">
    @for (trip of trips; track trip._id) {
    <div class="col-md-4">
      <app-trip-card [trip]="trip" (deleted)="onDelete($event)"></app-trip-card>
    </div>
    }
  </div>
  }
</div>
