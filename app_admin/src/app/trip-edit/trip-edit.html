<div class="container mt-4">
  <h2>{{ isEdit ? 'Edit Trip' : 'Add Trip' }}</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Code</label>
      <input type="text" class="form-control" [(ngModel)]="trip.code" name="code" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" [(ngModel)]="trip.name" name="name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="date" class="form-control" [(ngModel)]="trip.start" name="start" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input type="text" class="form-control" [(ngModel)]="trip.resort" name="resort" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input type="number" class="form-control" [(ngModel)]="trip.perPerson" name="perPerson" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Image (filename, e.g. kayak.jpg)</label>
      <input type="text" class="form-control" [(ngModel)]="trip.image" name="image" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="3" [(ngModel)]="trip.description" name="description" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary me-2">{{ isEdit ? 'Update' : 'Save' }}</button>
    <a class="btn btn-secondary" routerLink="/trips">Cancel</a>

    @if (message) {
      <p class="text-danger mt-2">{{ message }}</p>
    }
  </form>
</div>
